name: Расписание КГМУ
on:
  schedule:
    - cron: "17 2,8,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: unzip -o kgmu-schedule.zip -d app
      - run: pip install openpyxl
      - name: Свежее расписание с сайта КГМУ
        working-directory: app
        run: python scraper/build.py || echo "::warning::Сайт КГМУ недоступен, публикую данные из архива"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/site
      - id: d
        uses: actions/deploy-pages@v4
